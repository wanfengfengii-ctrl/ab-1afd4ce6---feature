# 扫描向量浪涌排序 —— Docker Compose
#
# 常用命令：
#   启动站点（端口可用环境变量 WEB_PORT 配置，默认 8080）：
#       WEB_PORT=9090 docker compose up --build -d
#   运行代码测试 + 构建检查 + HTTP 冒烟（verify 自行退出，退出码即结论）：
#       docker compose run --rm verify
#   一条命令全部执行（verify 退出后 web 继续提供服务）：
#       docker compose up --build --abort-on-container-exit --exit-code-from verify
#   仅查看 verify 结论：
#       docker compose inspect --format '{{.State.ExitCode}}' $(docker compose ps -q verify)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: surge-vector-sorter:latest
    container_name: surge-vector-sorter-web
    ports:
      # 宿主机端口可配置：WEB_PORT=9090 docker compose up
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  verify:
    # 一次性校验服务：代码测试 → 构建检查 → HTTP 冒烟，完成后自行退出，
    # 退出码 0 表示全部通过，非 0 即失败结论。
    image: node:22-alpine
    container_name: surge-vector-sorter-verify
    working_dir: /app
    volumes:
      - ./:/app:ro
    command:
      - sh
      - -c
      - |
        set -e
        echo "==== [1/3] 代码测试（node --test，闭环 n! 对拍 + 缓变 Fubini 全枚举对拍） ===="
        node --test test/solver.test.mjs test/ramping.test.mjs
        echo "==== [2/3] 构建检查 ===="
        node scripts/build-check.mjs
        echo "==== [3/3] HTTP 冒烟（http://web:80） ===="
        BASE_URL=http://web:80 node test/smoke.mjs
        echo "==== verify 全部通过 ===="
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
