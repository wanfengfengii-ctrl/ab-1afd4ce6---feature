server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # 容器/编排健康检查端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        # 纯静态：找不到的资源明确返回 404，不做 SPA 回落
        try_files $uri $uri/ =404;
    }

    # 保证 ES Module / 模块 Worker 以 JavaScript MIME 提供
    location ~* \.js$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        try_files $uri =404;
    }

    location = /favicon.ico {
        log_not_found off;
        return 204;
    }
}
